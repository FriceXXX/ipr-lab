apiVersion: v1
kind: Secret
metadata:
  name: messager-db-secret
type: Opaque
stringData:
  POSTGRES_USER: "messenger"
  POSTGRES_PASSWORD: "secret123"
  USER_DB_DSN: "host=postgres user=messenger password=secret123 dbname=messager_users sslmode=disable"
  MSG_DB_DSN: "host=postgres user=messenger password=secret123 dbname=messager_messages sslmode=disable"