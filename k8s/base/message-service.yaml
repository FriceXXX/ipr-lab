apiVersion: apps/v1
kind: Deployment
metadata:
  name: message-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: message-service
  template:
    metadata:
      labels:
        app: message-service
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: workload
                    operator: In
                    values:
                      - app
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: disk
                    operator: In
                    values:
                      - fast
      containers:
      - env:
        - name: HTTP_PORT
          valueFrom:
            configMapKeyRef:
              key: MSG_HTTP_PORT
              name: messager-config
        - name: DB_DSN
          valueFrom:
            secretKeyRef:
              key: MSG_DB_DSN
              name: messager-db-secret
        - name: UPLOADS_DIR
          valueFrom:
            configMapKeyRef:
              key: MSG_UPLOADS_DIR
              name: messager-config
        image: mablinov2704/message-service:latest
        name: message-service
        securityContext:
          privileged: true
          allowPrivilegeEscalation: true
        ports:
        - containerPort: 8082
        readinessProbe:
          tcpSocket:
            port: 8082
          initialDelaySeconds: 10
          periodSeconds: 5
        livenessProbe:
          tcpSocket:
            port: 8082
          initialDelaySeconds: 30
          periodSeconds: 10
        resources:
          requests:
            cpu: 150m
            memory: 192Mi
          limits:
            cpu: 300m
            memory: 384Mi
        volumeMounts:
        - mountPath: /app/uploads
          name: uploads
      volumes:
      - name: uploads
        persistentVolumeClaim:
          claimName: message-uploads-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: message-service
spec:
  selector:
    app: message-service
  ports:
    - port: 8082
      targetPort: 8082